<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minikin admin hash</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px}input,button{font-size:18px;padding:10px;width:100%;box-sizing:border-box;margin:8px 0}code{display:block;word-break:break-all;background:#eef;padding:10px;font-size:14px}</style></head>
<body><h2>Minikin admin hash</h2>
<p>Type the admin password you want. Nothing is sent anywhere; the hash is made inside your browser.</p>
<input id="pw" type="password" placeholder="Password (long, 12+ characters)" autocomplete="off">
<button id="go">Make hash</button>
<code id="out"></code>
<p>Send only the hash (64 characters) to Instinct. Never send the password.</p>
<script>
document.getElementById("go").onclick=async()=>{
 const pw=document.getElementById("pw").value; if(!pw)return;
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("minikin-admin:"+pw));
 document.getElementById("out").textContent=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
};
</script></body></html>
